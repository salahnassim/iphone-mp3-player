name: MonLecteur
options:
  bundleIdPrefix: com.moi
  deploymentTarget:
    iOS: "16.0"
targets:
  MonLecteur:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Mon Lecteur
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moi.monlecteur
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
